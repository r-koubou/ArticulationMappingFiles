name: Check YAML BOM

on:
  pull_request:

jobs:
  check-yaml-bom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check UTF-8 BOM in YAML files
        shell: bash
        run: |
          found=0

          while IFS= read -r -d '' file; do
            if head -c 3 "$file" | grep -q $'^\xEF\xBB\xBF'; then
              echo "::error file=$file::UTF-8 BOM detected. Save this YAML file as UTF-8 without BOM."
              found=1
            fi
          done < <(find . \
            -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' \
            -print0)

          exit "$found"
